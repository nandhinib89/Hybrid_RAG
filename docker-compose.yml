services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: hybrid-rag-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/vector_db:/app/data/vector_db

    restart: unless-stopped

    networks:
      - app-network


  frontend:
    build: ./frontend

    container_name: hybrid-rag-frontend

    ports:
      - "3000:8501"

    environment:
      API_URL: http://backend:8000

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - app-network


networks:
  app-network:
    driver: bridge